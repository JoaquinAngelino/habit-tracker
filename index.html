<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d2024" media="(prefers-color-scheme: dark)">
  <title>Habit Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect y='9' width='32' height='14' fill='%231d8a4e'/%3E%3Cpath d='M9 16l4 4 9-8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand" data-i18n="title">Habit Tracker</h1>
    <nav class="tabs" aria-label="Views" data-i18n-label="views">
      <a class="tab" href="#today" aria-current="page" data-i18n="tabToday">Today</a>
      <a class="tab" href="#tasks" data-i18n="tabTasks">Tasks</a>
      <a class="tab" href="#progress" data-i18n="tabProgress">Progress</a>
      <a class="tab" href="#habits" data-i18n="tabHabits">Habits</a>
    </nav>
    <span id="today" class="today"></span>
    <span id="sync" class="status sync" role="status"></span>
    <button id="settingsToggle" type="button" class="btn" aria-expanded="false" aria-controls="settings" data-i18n="settings">Settings</button>
    <select id="language" class="lang" aria-label="Language" data-i18n-label="language">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </header>

  <section id="settings" class="settings" hidden>
    <div class="setting">
      <label class="field">
        <span class="field-label" data-i18n="syncWith">Sync with</span>
        <select id="syncMode">
          <option value="account" data-i18n="mode_account">Account</option>
          <option value="github" data-i18n="mode_github">GitHub repository</option>
          <option value="none" data-i18n="mode_none">This device only</option>
        </select>
      </label>
      <p id="noneHint" class="hint" data-i18n="noneHint"></p>
      <div id="accountBlock" class="setting">
        <p id="accountHint" class="hint" data-i18n="accountHint"></p>
        <div id="googleButton"></div>
        <div id="passkeyButtons" class="row"></div>
        <div id="signedIn" class="setting" hidden>
          <p id="signedInAs"></p>
          <p class="hint" data-i18n="signOutHint"></p>
          <div id="accountActions" class="row"></div>
          <div id="accountExtras" class="setting"></div>
        </div>
      </div>
      <div id="githubBlock" class="setting">
        <label class="field">
          <span class="field-label" data-i18n="repo">Repository</span>
          <input id="repo" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="owner/habit-tracker">
        </label>
        <label class="field">
          <span class="field-label" data-i18n="branch">Branch</span>
          <input id="branch" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="data">
        </label>
        <p class="hint" data-i18n-html="branchHint"></p>
        <label class="field">
          <span class="field-label" data-i18n="token">GitHub token</span>
          <input id="token" type="password" autocomplete="off" spellcheck="false">
        </label>
        <p class="hint" data-i18n-html="tokenHint"></p>
      </div>
    </div>
    <div id="passphraseBlock" class="setting">
      <label class="field">
        <span class="field-label" data-i18n="passphrase">Passphrase</span>
        <input id="passphrase" type="password" autocomplete="off" spellcheck="false">
      </label>
      <p id="passphraseHint" class="hint"></p>
      <label class="check">
        <input id="remember" type="checkbox">
        <span data-i18n="remember">Remember sign-in and passphrase on this device</span>
      </label>
      <div class="row">
        <button id="syncNow" type="button" class="btn" data-i18n="syncNow">Sync now</button>
        <button id="forget" type="button" class="btn-text btn-small" data-i18n="forget">Forget passphrase</button>
      </div>
      <div id="recoveryBox" class="row"></div>
    </div>
    <div class="row">
      <button id="exportData" type="button" class="btn-text btn-small" data-i18n="exportData">Download my data</button>
      <button id="importData" type="button" class="btn-text btn-small" data-i18n="importData">Import data</button>
      <button id="calendarFile" type="button" class="btn-text btn-small" data-i18n="calendarFile">Download calendar</button>
      <input id="importFile" type="file" accept=".json,.csv,application/json,text/csv" hidden>
      <button id="installApp" type="button" class="btn-text btn-small" data-i18n="installApp" hidden>Install app</button>
    </div>
    <p id="importResult" class="hint" role="status" hidden></p>
  </section>

  <div id="banner" class="banner" role="alert" hidden></div>
  <main id="view" class="work"></main>
  <footer class="footer"><a href="privacy.html" data-i18n="privacy">Privacy</a> · <a href="terms.html" data-i18n="terms">Terms</a></footer>
</body>
</html>
